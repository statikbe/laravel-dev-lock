name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.4, 8.5]
        laravel: [11.*, 12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Laravel 11 predates PHP 8.5 and is past security support, so it will never
          # get a compatibility patch for it. The package itself supports 8.3+ on every
          # other branch.
          - laravel: 11.*
            php: 8.5
        include:
          - laravel: 11.*
            testbench: 9.*
            # Every Laravel 11 release carries an advisory that will not be patched, so
            # Composer refuses to install one until its blocking policy is switched off.
            composer-flags: --no-security-blocking
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      # laravel/pao is an agent-friendly output formatter for the test tooling. It declares
      # `conflict: laravel/framework <12.0.0`, which no Laravel 11 resolution can satisfy. It is
      # a dev-only convenience and is not referenced anywhere in the package, so the Laravel 11
      # lane simply drops it. Consumers are unaffected either way: require-dev is never installed
      # for them.
      - name: Drop the agent output formatter on Laravel 11
        if: matrix.laravel == '11.*'
        run: composer remove laravel/pao --dev --no-update --no-interaction

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts ${{ matrix.composer-flags }}
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        if: runner.os != 'Windows'
        run: composer test:types

      - name: Test Suite
        if: runner.os != 'Windows'
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest
